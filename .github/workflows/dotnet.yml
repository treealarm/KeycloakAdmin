name: .NET

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # A tag publishes through Trusted Publishing: the job asks GitHub for an OIDC token and
    # NuGet/login exchanges it for a temporary API key, so no long-lived secret is stored.
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout repo with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore KeycloakAdmin.sln

    - name: Build
      run: dotnet build --configuration Release KeycloakAdmin.sln

    # A push to main is a build; a tag is a release. The tag has to name the version in
    # KeycloakAdmin.csproj, so a release cannot go out under the wrong number, and a version already on
    # nuget.org fails the push instead of being skipped: --skip-duplicate once let a fix sit
    # unpublished on main because nobody had bumped <Version>.
    - name: Check the tag names the package version
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        version=$(dotnet msbuild KeycloakAdmin.csproj -getProperty:Version)
        if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
          echo "::error::tag $GITHUB_REF_NAME does not match <Version>$version</Version> in KeycloakAdmin.csproj"
          exit 1
        fi

    # Trusted Publishing: nuget.org matches the OIDC token against the policy configured for this
    # repository and workflow, and issues a key valid for an hour. Request it right before the push.
    - name: NuGet login
      if: startsWith(github.ref, 'refs/tags/v')
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push to NuGet
      if: startsWith(github.ref, 'refs/tags/v')
      run: dotnet nuget push "**/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
